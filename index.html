<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>PinkyPromise</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300;1,6..72,400&family=Fraunces:opsz,wght,SOFT,WONK@9..144,300..700,0..100,0..1&display=swap">
<style>
/* Layout: a slim control bar (title + five moment pills) and caption above a front-facing iPad Pro in landscape, scaled to fit. Inside: iPadOS status bar, the app's pill nav, and the companion screens on a soft grey canvas with white rounded cards. Single light theme on purpose: it depicts a physical tablet. */
:root {
  --page: #F4E6E8;
  --canvas: #FCF5F5;
  --card: #FFFBFB;
  --fill: #F6EAEC;
  --line: #EEDDE0;
  --ink: #18190F;
  --sub: #77766C;
  --blue: #FF8FB1;
  --blue-2: #F2577E;
  --blue-soft: #FFE1EA;
  --accent-ink: #A3214F;
  --navy: #18190F;
  --ok: #4F6B2A; --ok-bg: #E6EAD6;
  --warn: #A65A00; --warn-bg: #FFE8C7;
  --crit: #C2412D; --crit-bg: #FBE1DA;
  --font: "Inter Tight", "Helvetica Neue", Arial, sans-serif;
  --serif: "Newsreader", Georgia, "Times New Roman", serif;
  --ios: -apple-system, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --r-lg: 26px; --r-md: 20px; --r-sm: 14px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--page); color: var(--ink); font-family: var(--font); margin: 0; font-size: 15px; line-height: 1.45; }
.wrap { min-height: 100%; padding-block: 16px 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 14px; justify-items: center; align-content: start; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible, textarea:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

.controls { width: min(100%, 1400px); background: var(--card); border-radius: 12px; padding: 8px 8px 8px 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.controls h1 { margin: 0; font-size: 16px; font-weight: 800; white-space: nowrap; display: flex; align-items: center; gap: 8px; }
.mark { width: 26px; height: 26px; border-radius: 50%; background: conic-gradient(from 200deg, var(--blue), var(--blue-2), var(--blue)); position: relative; display: inline-block; flex: none; }
.mark::after { content: ""; position: absolute; inset: 8px; border-radius: 50%; background: var(--card); }
.moments { display: flex; gap: 6px; overflow-x: auto; flex: 1; justify-content: center; scrollbar-width: none; min-width: 0; }
.mo { padding: 9px 16px; border-radius: 12px; background: var(--fill); font-weight: 600; font-size: 13.5px; white-space: nowrap; }
.mo.on { background: var(--ink); color: #fff; }
.caption { margin: 0; font-size: 18px; text-align: center; text-wrap: balance; max-width: 50ch; }

/* iPad Pro frame, landscape, front */
.fit { position: relative; }
.ipad { position: absolute; top: 0; left: 0; width: 1250px; height: 890px; transform-origin: 0 0; border-radius: 46px; padding: 4px;
  background: linear-gradient(145deg, #D9DCE1 0%, #A9AEB6 40%, #E3E5E9 60%, #9EA3AB 100%);
  box-shadow: 0 30px 60px rgba(15,23,41,.22), 0 4px 10px rgba(15,23,41,.12); }
.bezel { width: 100%; height: 100%; background: #0B0C0E; border-radius: 42px; padding: 24px; position: relative; }
.cam { position: absolute; top: 9px; left: 50%; width: 7px; height: 7px; margin-left: -3.5px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #3A4250, #0A0B0D 70%); }
.screen { width: 1194px; height: 834px; border-radius: 20px; overflow: hidden; background: var(--canvas); display: grid; grid-template-rows: auto 1fr; position: relative; }

/* iPadOS status bar */
.status { height: 28px; display: flex; justify-content: space-between; align-items: center; padding: 4px 22px 0; font-family: var(--ios); font-size: 13.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
.status .r { display: flex; gap: 7px; align-items: center; }
.status svg { display: block; }

/* app nav */
.appnav { margin: 6px 22px 0; background: var(--card); border-radius: 12px; padding: 8px 8px 8px 18px; display: flex; align-items: center; gap: 16px; }
.logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; white-space: nowrap; }
.tabs { display: flex; gap: 6px; flex: 1; justify-content: center; }
.tab { padding: 10px 20px; border-radius: 12px; background: var(--fill); font-weight: 500; font-size: 14px; }
.tab.on { background: var(--blue); color: #fff; box-shadow: none; }
.navend { display: flex; gap: 8px; align-items: center; }
.ib { width: 40px; height: 40px; border-radius: 50%; background: var(--fill); display: grid; place-items: center; }
.doc { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #CFE0FF, #9DBBFF); color: var(--navy); font-weight: 700; font-size: 13px; display: grid; place-items: center; }

.content { overflow-y: auto; padding: 18px 22px 22px; display: grid; gap: 16px; align-content: start; }
.ptrow { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.avatar { width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg, #FFD9C7, #F6B79C); display: grid; place-items: center; font-weight: 700; font-size: 16px; color: #7A3B22; flex: none; }
.ptrow h2 { margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -.02em; line-height: 1.05; }
.ptrow h2 span { font-weight: 300; }
.ex { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; background: var(--card); color: var(--sub); padding: 4px 9px; border-radius: 12px; }
.prof { display: flex; flex-wrap: wrap; gap: 4px; margin-left: auto; }
.prof span { font-size: 12.5px; font-weight: 600; padding: 6px 12px; border-radius: 12px; background: var(--blue-soft); color: var(--accent-ink); }

.panel { background: var(--card); border-radius: var(--r-lg); padding: 26px; display: grid; gap: 18px; align-content: start; }
.panel.narrow { width: min(100%, 820px); justify-self: center; }
h3 { font-size: 26px; line-height: 1.12; margin: 0; letter-spacing: -.02em; font-weight: 700; text-wrap: balance; }
h4 { font-size: 13px; color: var(--sub); margin: 0 0 8px; font-weight: 500; }
.steps { display: flex; gap: 6px; flex-wrap: wrap; }
.step { font-size: 12.5px; font-weight: 600; padding: 6px 12px; border-radius: 12px; background: var(--fill); color: var(--sub); }
.step.done { color: var(--accent-ink); background: var(--blue-soft); }
.step.now { background: var(--ink); color: #fff; }
.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.choice { text-align: left; background: var(--fill); border-radius: var(--r-md); padding: 20px; display: grid; gap: 8px; border: 2px solid transparent; transition: border-color .15s, transform .15s; position: relative; }
.choice:hover { border-color: var(--accent-ink); transform: translateY(-1px); }
.choice .q { font-size: 21px; line-height: 1.2; font-weight: 600; letter-spacing: -.01em; padding-right: 38px; }
.choice .k { font-size: 12px; font-weight: 600; color: var(--sub); }
.choice .sug { font-size: 12px; font-weight: 700; color: var(--accent-ink); }
.choice::after { content: "↗"; position: absolute; top: 16px; right: 16px; width: 32px; height: 32px; border-radius: 50%; background: var(--card); display: grid; place-items: center; font-size: 14px; color: var(--accent-ink); }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { background: var(--blue); color: #fff; border-radius: 12px; padding: 13px 24px; font-weight: 600; font-size: 15px; box-shadow: none; }
.btn.ghost { background: var(--fill); color: var(--ink); box-shadow: none; }
.btn.crit { background: var(--crit); box-shadow: 0 6px 16px rgba(210,54,42,.25); }
.btn:disabled { opacity: .4; cursor: default; box-shadow: none; }
.rec { display: grid; place-items: center; gap: 12px; padding: 28px; background: var(--fill); border-radius: var(--r-md); }
.recbtn { width: 84px; height: 84px; border-radius: 50%; background: var(--crit); color: #fff; font-weight: 700; font-size: 13px; box-shadow: 0 0 0 8px var(--crit-bg); }
.recbtn.stop { border-radius: 22px; width: 68px; height: 68px; }
.timer { font-variant-numeric: tabular-nums; font-size: 36px; font-weight: 300; letter-spacing: -.02em; }
.wave { display: flex; gap: 3px; align-items: center; height: 38px; }
.wave span { width: 4px; border-radius: 2px; background: var(--crit); height: 30%; animation: wv .9s ease-in-out infinite; }
.wave.still span { animation: none; background: #B7BDCA; }
@keyframes wv { 0%,100% { height: 20%; } 50% { height: 100%; } }
.prompt-banner { justify-self: start; background: var(--blue-soft); color: var(--accent-ink); border-radius: 12px; padding: 9px 18px; font-weight: 600; font-size: 15.5px; }
textarea { width: 100%; min-height: 120px; border: 0; border-radius: var(--r-md); padding: 18px; font: 17px/1.5 var(--font); color: var(--ink); background: var(--fill); resize: vertical; }
.msgcard { background: linear-gradient(135deg, var(--blue) 0%, var(--blue-2) 100%); color: #fff; border-radius: var(--r-md); padding: 22px; display: grid; gap: 14px; box-shadow: none; }
.msgcard .meta { font-size: 13px; opacity: .9; display: flex; align-items: center; gap: 10px; }
.msgcard .meta i { width: 34px; height: 34px; border-radius: 50%; background: #fff; color: var(--accent-ink); display: grid; place-items: center; font-style: normal; font-size: 12px; flex: none; }
.msgcard blockquote { margin: 0; font-size: 20px; line-height: 1.45; font-weight: 500; }
.prog { height: 4px; border-radius: 2px; background: rgba(255,255,255,.3); overflow: hidden; }
.prog i { display: block; height: 100%; width: 0; background: #fff; }
.prog.run i { animation: pg 4s linear forwards; }
@keyframes pg { to { width: 100%; } }
.toggles { display: grid; gap: 8px; }
.tg { display: flex; justify-content: space-between; align-items: center; gap: 14px; padding: 15px 18px; background: var(--fill); border-radius: var(--r-sm); font-weight: 600; }
.sw { flex: none; width: 46px; height: 28px; border-radius: 99px; background: #C9CFDA; position: relative; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 3px rgba(0,0,0,.15); }
.sw.on { background: var(--blue); }
.sw.on::after { transform: translateX(18px); }
.note { font-size: 14px; color: var(--sub); margin: 0; }
.done-box { display: inline-flex; align-items: center; gap: 8px; justify-self: start; background: var(--ok-bg); color: var(--ok); border-radius: 12px; padding: 9px 18px; font-weight: 700; }
.done-box::before { content: "✓"; }
.qblock { display: grid; gap: 10px; }
.qblock .qt { font-size: 16px; font-weight: 600; }
.opts { display: flex; flex-wrap: wrap; gap: 6px; }
.opt { background: var(--fill); border-radius: 12px; padding: 10px 18px; font-size: 14.5px; font-weight: 600; }
.opt.on { background: var(--blue); color: #fff; }
.profile-card { background: var(--fill); border-radius: var(--r-md); padding: 6px 20px; display: grid; }
.profile-card div { display: grid; grid-template-columns: 1fr auto; gap: 12px; padding: 14px 0; border-top: 1px solid var(--line); align-items: center; }
.profile-card div:first-child { border-top: 0; }
.profile-card span { color: var(--sub); font-size: 14px; }
.profile-card b { font-weight: 700; text-align: right; font-size: 16px; }

.grid3 { display: grid; grid-template-columns: 1.6fr 1fr; gap: 16px; align-items: stretch; }
.headrow { display: flex; gap: 10px; align-items: center; justify-content: space-between; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; padding: 7px 13px; border-radius: 12px; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.ok { color: var(--ok); background: var(--ok-bg); }
.pill.warn { color: var(--warn); background: var(--warn-bg); }
.pill.crit { color: var(--crit); background: var(--crit-bg); }
.pill.mute { color: var(--sub); background: var(--fill); justify-self: start; }
.chart svg { width: 100%; height: auto; display: block; }
.big { font-size: 56px; font-weight: 300; letter-spacing: -.04em; line-height: 1; font-variant-numeric: tabular-nums; }
.big small { font-size: 15px; font-weight: 600; color: var(--sub); letter-spacing: 0; margin-left: 8px; }
.fact { display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 11px 0; border-top: 1px solid var(--line); font-size: 15px; }
.fact:first-of-type { border-top: 0; }
.fact .l { color: var(--sub); }
.fact .v { font-weight: 600; text-align: right; }
.reasons { display: grid; gap: 6px; }
.reasons span { background: var(--fill); border-radius: 12px; padding: 10px 14px; font-size: 15px; font-weight: 500; }
.log { display: grid; gap: 10px; font-size: 15px; }
.log div { display: flex; gap: 12px; align-items: center; }
.log time { color: var(--sub); font-variant-numeric: tabular-nums; flex: none; width: 48px; font-size: 13.5px; }
.routes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.route { text-align: left; background: var(--fill); border-radius: var(--r-sm); padding: 16px; font-weight: 600; font-size: 15px; display: grid; gap: 4px; border: 2px solid transparent; }
.route.sel { border-color: var(--accent-ink); background: var(--blue-soft); }
.route .sug { font-size: 11.5px; color: var(--accent-ink); font-weight: 700; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { background: var(--fill); border-radius: 12px; padding: 9px 15px; font-size: 14px; font-weight: 600; }
.tag.on { background: var(--ink); color: #fff; }

/* COM-B needs */
.comb { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 3px 9px; border-radius: 12px; margin-right: 8px; vertical-align: 2px; }
.comb.m { background: #EFE7FF; color: #6A3FD6; }
.comb.c { background: var(--blue-soft); color: var(--accent-ink); }
.comb.o { background: #E3F4EE; color: #12805C; }
.qblock .hint { font-size: 13px; color: var(--sub); font-weight: 400; margin-left: 4px; }
.record { display: flex; align-items: center; gap: 10px; background: var(--fill); border-radius: var(--r-sm); padding: 10px 14px; font-size: 14px; }
.record b { font-weight: 700; }
.record span { color: var(--sub); }
.plan { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.plan > div { background: var(--fill); border-radius: var(--r-md); padding: 16px; display: grid; gap: 6px; align-content: start; }
.plan small { font-size: 12.5px; color: var(--sub); }
.plan b { font-size: 16px; font-weight: 700; line-height: 1.3; }
.preview { background: #EFE7DD; border-radius: var(--r-md); padding: 16px; display: grid; gap: 8px; }
.preview small { font-size: 12.5px; color: var(--sub); }
.preview .bub { justify-self: start; max-width: 80%; background: #fff; border-radius: 0 10px 10px 10px; padding: 10px 14px; font-family: var(--ios); font-size: 16px; box-shadow: 0 1px .5px rgba(11,20,26,.13); }

/* phases (outside the tablet) */
.phases { display: flex; gap: 8px; flex: 1; justify-content: center; flex-wrap: wrap; min-width: 0; }
.ph { display: flex; align-items: center; gap: 6px; padding: 5px 5px 5px 14px; border-radius: 12px; background: var(--fill); }
.ph > b { font-size: 13px; font-weight: 700; color: var(--sub); white-space: nowrap; margin-right: 2px; }
.ph.on { background: var(--blue-soft); }
.ph.on > b { color: var(--accent-ink); }
.ph .mo { background: var(--card); padding: 7px 13px; font-size: 13px; }
.ph .mo.on { background: var(--ink); color: #fff; }

/* app shell */
.app { display: grid; grid-template-columns: 210px 1fr; min-height: 0; }
.side { background: var(--card); margin: 6px 0 16px 16px; border-radius: var(--r-lg); padding: 18px 12px 12px; display: flex; flex-direction: column; gap: 4px; min-height: 0; }
.side .logo { padding: 2px 8px 18px; font-size: 15px; }
.nav { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 12px 14px; border-radius: 12px; font-weight: 600; font-size: 14.5px; color: var(--sub); }
.nav svg { flex: none; }
.nav.on { background: var(--blue); color: #fff; box-shadow: none; }
.nav .badge { margin-left: auto; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 99px; background: var(--crit); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; }
.side .me { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: var(--r-md); background: var(--fill); }
.side .me b { display: block; font-size: 13.5px; }
.side .me span { font-size: 12px; color: var(--sub); }
.main { display: grid; grid-template-rows: auto 1fr; min-height: 0; }
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 22px 0; min-height: 50px; }
.back { font-weight: 600; font-size: 15px; color: var(--accent-ink); padding: 8px 4px; }
.search { display: flex; align-items: center; gap: 8px; width: 260px; background: var(--card); border-radius: 12px; padding: 11px 18px; color: var(--sub); font-size: 14px; }
.subtabs { display: flex; gap: 6px; }
.subtab { padding: 10px 20px; border-radius: 12px; background: var(--card); font-weight: 600; font-size: 14px; }
.subtab.on { background: var(--ink); color: #fff; }
.subtab:disabled { opacity: .45; cursor: not-allowed; }
.pill.blue { color: var(--accent-ink); background: var(--blue-soft); }

/* today list */
.dayhead { display: flex; align-items: baseline; gap: 14px; }
.dayhead h2 { margin: 0; font-size: 34px; font-weight: 800; letter-spacing: -.02em; }
.dayhead span { font-size: 18px; font-weight: 300; color: var(--sub); }
.list { display: grid; gap: 0; padding: 10px 14px; }
.row { display: grid; grid-template-columns: 58px 44px 1fr auto 40px; gap: 14px; align-items: center; width: 100%; text-align: left; padding: 14px 10px; border-top: 1px solid var(--line); cursor: default; }
.row:first-child { border-top: 0; }
.row.me { cursor: pointer; background: var(--blue-soft); border-radius: var(--r-md); border-top-color: transparent; }
.row.me + .row { border-top-color: transparent; }
.row time { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--sub); }
.row b { display: block; font-size: 16.5px; }
.row small { font-size: 13.5px; color: var(--sub); }
.row .avatar { width: 44px; height: 44px; font-size: 14px; }
.avatar.gray { background: var(--fill); color: var(--sub); }
.go { width: 40px; height: 40px; border-radius: 50%; background: var(--blue); color: #fff; display: grid; place-items: center; font-size: 15px; }

/* adherence profile */
.pgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.pgrid .panel { padding: 20px; gap: 12px; }
.pgrid h4 { margin: 0; }
.span2 { grid-column: span 2; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips span { background: var(--fill); border-radius: 12px; padding: 7px 12px; font-size: 13.5px; font-weight: 600; }
.kv { display: grid; gap: 2px; }
.kv small { font-size: 12.5px; color: var(--sub); }
.kv b { font-size: 16px; line-height: 1.3; }
.rule { display: grid; grid-template-columns: 54px 1fr; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); font-size: 14.5px; font-weight: 600; }
.rule:first-of-type { border-top: 0; }
.rule .th { font-size: 26px; font-weight: 300; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.rule small { display: block; font-weight: 400; color: var(--sub); font-size: 13px; }
.sigs { display: grid; grid-template-columns: 1fr 1fr; gap: 0 28px; }
.sig { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); font-size: 14.5px; font-weight: 600; }
.sig em { font-style: normal; font-size: 11.5px; font-weight: 700; color: var(--accent-ink); margin-left: 6px; }
.dots i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--line); margin-left: 4px; }
.dots i.on { background: var(--blue); }
.msgcard.compact { padding: 18px; gap: 10px; box-shadow: none; }
.msgcard.compact blockquote { font-size: 16px; }
.pfoot { display: flex; justify-content: space-between; align-items: center; gap: 12px; }

/* Daylight skin (from .stitch/DESIGN.md): warm cream, olive-black ink, one amber accent, light serif display type, tonal surfaces without shadows. Newsreader and Inter Tight stand in for ABC Arizona Flare and ABC Room. */
body { letter-spacing: -.01em; }
h2, h3, .big, .timer, .rule .th, .choice .q, .qblock .qt, .dayhead span { font-family: var(--serif); font-weight: 300; letter-spacing: -.035em; }
h3 { font-size: 34px; line-height: 1; }
.ptrow h2, .dayhead h2 { font-family: var(--serif); font-weight: 300; letter-spacing: -.04em; line-height: .97; }
.ptrow h2 { font-size: 40px; }
.ptrow h2 span, .dayhead span { font-style: italic; color: var(--sub); }
.dayhead h2 { font-size: 52px; }
.big { font-size: 66px; }
.big small, .comb, .hint { font-family: var(--font); letter-spacing: 0; }
.qblock .qt { font-size: 21px; font-weight: 400; }
.choice .q { font-size: 27px; }
h4 { text-transform: uppercase; font-size: 11.5px; font-weight: 600; letter-spacing: .02em; }
.controls h1 { font-weight: 600; }
.btn { color: var(--ink); border-radius: 16px; padding: 17px 26px; text-transform: uppercase; font-weight: 500; font-size: 13.5px; letter-spacing: 0; box-shadow: 0 0 0 0 rgba(255,143,177,.6); transition: box-shadow .3s ease-out, opacity .3s ease-out; }
.btn:hover:not(:disabled) { box-shadow: 0 0 24px 0 rgba(255,143,177,.6); }
.btn.ghost { background: var(--fill); color: var(--ink); }
.btn.ghost:hover:not(:disabled) { box-shadow: 0 0 24px 0 rgba(24,25,15,.2); }
.btn.crit { color: #fff; }
.btn.crit:hover:not(:disabled) { box-shadow: 0 0 24px 0 rgba(194,65,45,.45); }
.opt.on, .tab.on, .go { color: var(--ink); }
.nav { color: var(--ink); opacity: .6; }
.nav.on { background: var(--ink); color: var(--canvas); opacity: 1; }
.mo.on, .ph .mo.on, .step.now, .subtab.on, .tag.on { background: var(--ink); color: var(--canvas); }
.msgcard { background: var(--ink); color: var(--canvas); }
.msgcard .meta i { background: var(--blue); color: var(--ink); }
.msgcard blockquote { font-family: var(--serif); font-weight: 300; font-size: 25px; line-height: 1.22; letter-spacing: -.02em; }
.msgcard.compact blockquote { font-size: 19px; }
.prog { background: rgba(250,245,242,.2); }
.prog i { background: var(--blue); }
.prompt-banner { background: none; padding: 0; color: var(--ink); font-family: var(--serif); font-style: italic; font-weight: 400; font-size: 22px; }
.comb.m { background: var(--blue-soft); color: var(--accent-ink); }
.comb.c { background: var(--line); color: var(--ink); }
.comb.o { background: var(--ok-bg); color: var(--ok); }
.pill, .step, .chips span, .prof span, .tag, .opt, .done-box, .comb, .ex { border-radius: 8px; }
.mark { background: conic-gradient(from 200deg, #FF8FB1, #F2577E, #FFC4D6, #FF8FB1); }
.doc { background: var(--line); color: var(--ink); }
.avatar { background: linear-gradient(135deg, #FFD6E2, #F29AB5); color: #7A2244; }
.avatar.gray { background: var(--fill); color: var(--sub); }
.sw { background: #DCC8CD; }
.wave.still span { background: #DCC8CD; }
.preview, .ex { background: var(--fill); }
.choice:hover { border-color: var(--ink); }
.choice::after { color: var(--ink); background: var(--blue); }
.row.me { background: #FFEAF1; }
.ph.on { background: var(--blue-soft); }
.screen, .content { background: var(--canvas); }

/* set-up stepper: vertical rail of steps, current step's content on the right */
.stepper { display: grid; grid-template-columns: 250px 1fr; gap: 16px; align-items: start; }
.rail { list-style: none; margin: 0; background: var(--card); border-radius: var(--r-lg); padding: 24px 20px; display: grid; position: sticky; top: 0; }
.rs { display: grid; grid-template-columns: 32px 1fr; gap: 12px; position: relative; padding-bottom: 26px; }
.rs:last-child { padding-bottom: 0; }
.rs::before { content: ""; position: absolute; left: 15px; top: 36px; bottom: 4px; width: 2px; border-radius: 1px; background: var(--line); }
.rs:last-child::before { display: none; }
.rs.done::before { background: var(--blue); }
.rs .n { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--line); background: var(--card); display: grid; place-items: center; font-size: 13px; font-weight: 600; color: var(--sub); }
.rs.done .n { background: var(--blue); border-color: var(--blue); color: var(--ink); }
.rs.now .n { border-color: var(--ink); color: var(--ink); box-shadow: 0 0 0 4px var(--blue-soft); }
.rs b { display: block; font-size: 15px; font-weight: 600; line-height: 1.25; padding-top: 5px; }
.rs small { font-size: 12.5px; color: var(--sub); }
.rs.todo b { color: var(--sub); font-weight: 500; }
.stbody { min-height: 560px; align-content: start; }
.sthead { display: flex; justify-content: space-between; align-items: center; min-height: 34px; }
.sthead small { text-transform: uppercase; font-size: 11.5px; font-weight: 600; letter-spacing: .02em; color: var(--sub); }
.sthead .back { padding: 6px 2px; }
.bar { height: 4px; border-radius: 2px; background: var(--fill); overflow: hidden; margin-top: -8px; }
.bar i { display: block; height: 100%; background: var(--blue); transition: width .4s cubic-bezier(.4,0,.2,1); }
.stbody .plan { grid-template-columns: 1fr 1fr 1fr; }

/* patient-facing question screens: one question at a time, lots of room */
.stbody { padding: 30px 40px 36px; }
.qwrap { display: grid; gap: 34px; padding-top: 18px; max-width: 780px; }
.qbig { font-size: 46px; line-height: 1.02; letter-spacing: -.04em; }
.qhint { margin: 12px 0 0; font-size: 18px; color: var(--sub); }
.qcount { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .02em; color: var(--sub); }
.qcount i { width: 28px; height: 4px; border-radius: 2px; background: var(--line); }
.qcount i.on { background: var(--blue); }
.qcount span { margin-left: 8px; }
.bigopts { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.bo { display: flex; align-items: center; gap: 16px; text-align: left; min-height: 80px; padding: 20px 22px; border-radius: 18px; background: var(--fill); border: 2px solid transparent; font-size: 18px; font-weight: 500; line-height: 1.3; transition: border-color .15s, background .15s; }
.bo .ck { flex: none; width: 26px; height: 26px; border-radius: 8px; border: 2px solid #DCC8CD; display: grid; place-items: center; font-size: 13px; font-weight: 700; }
.bo.radio .ck { border-radius: 50%; }
.bo.on { background: var(--blue-soft); border-color: var(--blue); }
.bo.on .ck { background: var(--blue); border-color: var(--blue); color: var(--ink); }
.qwrap .toggles { gap: 12px; }
.qwrap .tg { padding: 22px 24px; font-size: 18px; font-weight: 500; border-radius: 18px; }
.qwrap .plan > div { padding: 22px; gap: 10px; }
.qwrap .btnrow { margin-top: 6px; }

/* patient-facing shell: welcome splash, plan, yearly */
.topbar .logo { font-size: 16px; }
.where { font-size: 14px; color: var(--sub); }
.splash { display: grid; align-content: center; justify-items: start; gap: 30px; padding: 10px 56px 30px; min-height: 690px; }
.splash h2 { margin: 0; font-family: var(--serif); font-weight: 300; font-size: 96px; line-height: .95; letter-spacing: -.045em; max-width: 11ch; }
.splash .ip { display: inline-flex; vertical-align: middle; gap: 5px; padding: 6px; border-radius: 99px; background: var(--ink); margin: 0 8px; transform: translateY(-8px); }
.splash .ip i { width: 56px; height: 56px; border-radius: 50%; background: var(--blue); color: var(--ink); display: grid; place-items: center; font-style: normal; font-size: 19px; }
.splash .ip i + i { background: rgba(250,245,242,.14); color: var(--canvas); }
.splash p { margin: 0; font-size: 23px; color: var(--sub); max-width: 30ch; }
.today { display: flex; align-items: center; gap: 12px; background: var(--card); border-radius: 16px; padding: 8px 22px 8px 8px; }
.today b { display: block; font-size: 15.5px; }
.today span { font-size: 13.5px; color: var(--sub); }
.planhead h2 { margin: 6px 0 0; font-family: var(--serif); font-weight: 300; font-size: 52px; letter-spacing: -.04em; line-height: 1; }
.planhead p { margin: 10px 0 4px; font-size: 17px; color: var(--sub); }
.how { display: grid; grid-template-columns: 40px 1fr; gap: 14px; align-items: start; padding: 12px 0; border-top: 1px solid var(--line); }
.how:first-of-type { border-top: 0; }
.how i { width: 40px; height: 40px; border-radius: 12px; background: var(--blue-soft); display: grid; place-items: center; font-style: normal; font-size: 15px; }
.how b { display: block; font-size: 15.5px; }
.how small { font-size: 13.5px; color: var(--sub); }
.panel.solo { width: min(100%, 900px); justify-self: center; padding: 36px 44px 40px; }
a.mo { text-decoration: none; color: var(--accent-ink); font-weight: 600; }

/* stage: tablet and phone side by side, scaled together */
.stage { position: absolute; top: 0; left: 0; width: 1730px; height: 940px; transform-origin: 0 0; display: flex; gap: 48px; align-items: flex-end; }
.stage .ipad { position: relative; flex: none; }
.dev { display: grid; gap: 16px; justify-items: center; flex: none; }
.dlabel { font-size: 17px; font-weight: 600; background: var(--card); padding: 9px 18px; border-radius: 12px; }
#phone { width: 432px; height: 893px; border: 0; background: transparent; display: block; }

.ready #device { transition: transform .95s cubic-bezier(.65,0,.35,1); }
.ready #fit { transition: height .95s cubic-bezier(.65,0,.35,1); }
.dev.phone { transition: opacity .7s ease .45s, transform .9s cubic-bezier(.16,1,.3,1) .45s; }
.stage.solo .dev.phone { opacity: 0; transform: translateX(120px) scale(.96); pointer-events: none; transition: opacity .25s ease, transform .25s ease; }

/* PinkyPromise round: archetype, video, invite */
.arch { background: var(--ink); color: var(--canvas); border-radius: 28px; padding: 40px 44px; display: grid; gap: 10px; position: relative; overflow: hidden; }
.arch::after { content: ""; position: absolute; right: -80px; top: -80px; width: 280px; height: 280px; border-radius: 50%; background: radial-gradient(circle, rgba(255,143,177,.55), rgba(255,143,177,0) 70%); }
.arch small { text-transform: uppercase; font-size: 12px; font-weight: 600; letter-spacing: .04em; color: var(--blue); }
.arch h2 { margin: 0; font-family: var(--serif); font-weight: 300; font-size: 84px; line-height: .95; letter-spacing: -.045em; }
.arch p { margin: 6px 0 0; font-size: 21px; opacity: .8; max-width: 30ch; }
.sil { position: absolute; left: 50%; bottom: 0; width: 46%; transform: translateX(-50%); fill: rgba(250,245,242,.16); }
.vcard { max-width: 620px; }
.poster { position: relative; aspect-ratio: 16 / 9; border-radius: 20px; overflow: hidden; background: radial-gradient(80% 90% at 70% 20%, rgba(255,143,177,.45), rgba(255,143,177,0) 60%), linear-gradient(160deg, #4A2A36, #18190F); }
.vcard.compact .poster { aspect-ratio: 4 / 3; }
.vplay { position: absolute; left: 50%; top: 50%; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%; background: var(--blue); color: var(--ink); display: grid; place-items: center; font-size: 20px; }
.vmeta { position: absolute; left: 14px; top: 14px; font-size: 12.5px; font-weight: 600; color: var(--canvas); background: rgba(24,25,15,.45); padding: 5px 10px; border-radius: 8px; }
.subs { position: absolute; left: 24px; right: 24px; bottom: 26px; text-align: center; color: #fff; font-family: var(--serif); font-size: 21px; line-height: 1.25; text-shadow: 0 1px 8px rgba(0,0,0,.6); }
.poster .prog { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; border-radius: 0; background: rgba(250,245,242,.2); }
.viewfinder { position: relative; aspect-ratio: 16 / 9; max-width: 620px; border-radius: 20px; overflow: hidden; background: linear-gradient(160deg, #3A3328, #18190F); }
.viewfinder.on { box-shadow: inset 0 0 0 3px var(--crit); }
.viewfinder .recbtn { position: absolute; left: 50%; bottom: 18px; margin-left: -34px; width: 68px; height: 68px; border-radius: 50%; background: var(--crit); box-shadow: 0 0 0 5px rgba(250,245,242,.85); }
.viewfinder .recbtn.stop { width: 68px; height: 68px; border-radius: 50%; background: #fff; }
.viewfinder .recbtn.stop::after { content: ""; position: absolute; inset: 22px; border-radius: 5px; background: var(--crit); }
.recdot { position: absolute; left: 16px; top: 14px; color: #fff; font-size: 13px; font-weight: 700; background: rgba(194,65,45,.9); padding: 5px 10px; border-radius: 8px; }
.recdot .timer { font-family: var(--font); font-size: 13px; font-weight: 700; letter-spacing: 0; }
.invite { display: flex; align-items: center; gap: 16px; justify-content: space-between; max-width: 620px; background: var(--fill); border-radius: 18px; padding: 16px 18px 16px 22px; }
.invite b { display: block; font-size: 16px; }
.invite small { font-size: 13.5px; color: var(--sub); }
.faces { display: flex; flex: none; }
.faces span { width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--fill); margin-left: -8px; display: grid; place-items: center; font-size: 13px; font-weight: 700; background: var(--blue-soft); color: var(--accent-ink); }
.faces span:first-child { margin-left: 0; }
.invite:has(.faces) { justify-content: flex-start; }
.sthead { justify-content: flex-end; }

/* tighten the set-up panel: Back floats top-right so content starts at the panel's top edge */
.stbody { position: relative; padding: 36px 40px 36px; }
.stbody .sthead { position: absolute; top: 18px; right: 22px; min-height: 0; }
.stbody .qwrap { padding-top: 0; }

/* motivation statement replaces the archetype name */
.arch h2 { font-size: 60px; line-height: 1.02; max-width: 15ch; }

/* consent privacy note */
.privacy { display: grid; grid-template-columns: 40px 1fr; gap: 14px; background: var(--fill); border-radius: 18px; padding: 18px 22px; }
.privacy .lock { width: 40px; height: 40px; border-radius: 12px; background: var(--card); display: grid; place-items: center; }
.privacy b { font-size: 16px; }
.privacy p { margin: 4px 0 0; font-size: 14px; line-height: 1.5; color: var(--sub); }
/* the question she answers: calm label, not a headline */
.prompt-banner { font-family: var(--font); font-style: normal; font-weight: 500; font-size: 19px; letter-spacing: -.01em; color: var(--ink); background: var(--fill); padding: 10px 16px; border-radius: 12px; }
/* invite by phone number */
.invite.col { display: grid; gap: 10px; justify-content: stretch; }
.qwrap .invite { max-width: 640px; padding: 18px; }
.qwrap .contact { padding: 12px 14px; font-size: 16px; }
.contact { display: grid; grid-template-columns: 32px auto 1fr 28px; gap: 12px; align-items: center; background: var(--card); border-radius: 12px; padding: 8px 10px; font-size: 14.5px; }
.contact span:not(.cav) { color: var(--sub); font-variant-numeric: tabular-nums; }
.contact button { color: var(--sub); font-size: 13px; }
.cav { width: 32px; height: 32px; border-radius: 50%; background: var(--blue-soft); color: var(--accent-ink); display: grid; place-items: center; font-weight: 700; font-size: 13px; }
.addrow { display: flex; gap: 8px; align-items: center; }
.addrow .field { flex: 1; background: var(--card); border-radius: 12px; padding: 13px 14px; color: var(--sub); font-size: 14.5px; }
.addrow .btn { padding: 13px 18px; }
.invite.sent { justify-content: flex-start; }
/* closing screen after she saves: thank-you and recap on the left, her video on the right */
.finale { position: relative; overflow: hidden; min-height: 690px; border-radius: 28px; background: var(--ink); color: var(--canvas); display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 56px; padding: 48px 56px; }
.finale::after { content: ""; position: absolute; left: -200px; top: -240px; width: 640px; height: 640px; border-radius: 50%; background: radial-gradient(circle, rgba(255,143,177,.4), rgba(255,143,177,0) 68%); pointer-events: none; }
.finale > * { position: relative; z-index: 1; }
.fl { display: grid; gap: 26px; justify-items: start; }
.finale small { text-transform: uppercase; font-size: 12px; font-weight: 600; letter-spacing: .04em; color: var(--blue); }
.finale h2 { margin: -10px 0 0; font-family: var(--serif); font-weight: 300; font-size: 88px; line-height: .95; letter-spacing: -.045em; }
.why { display: grid; gap: 10px; width: 100%; max-width: 540px; padding-top: 22px; border-top: 1px solid rgba(250,245,242,.16); }
.why span { text-transform: uppercase; font-size: 12px; font-weight: 600; letter-spacing: .04em; opacity: .6; }
.why b { font-family: var(--serif); font-weight: 300; font-size: 36px; line-height: 1.08; letter-spacing: -.035em; text-wrap: balance; }
.vcard.fin { width: 420px; max-width: none; }

/* Back sits in the panel's flow, top-left, so it never covers content */
.stbody .sthead { position: static; justify-content: flex-start; min-height: 0; margin: -18px 0 10px -4px; }

/* prompt screen: promotion vs prevention */
.choice { gap: 10px; padding: 24px; align-content: start; }
.choice .k { text-transform: uppercase; font-size: 11.5px; letter-spacing: .03em; color: var(--accent-ink); }
.choice .d { font-size: 15.5px; color: var(--sub); }

/* camera screen: her clip as the front camera, zoomed like a tablet selfie, with a question prompter */
.viewfinder { max-width: none; width: 100%; aspect-ratio: 16 / 10; }
.feed { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scale(1.5); transform-origin: 52% 30%; }
.poster .feed { transform: scale(1.35); }
.vcard.fin .poster .feed { transform: scale(1.4); transform-origin: 52% 22%; object-position: 52% 30%; }
.prompter { position: absolute; top: 14px; left: 14px; right: 14px; display: grid; gap: 4px; padding: 13px 60px 14px 18px; border-radius: 16px; background: rgba(24,25,15,.62); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); color: var(--canvas); }
.prompter small { text-transform: uppercase; font-size: 11px; font-weight: 600; letter-spacing: .04em; color: var(--blue); }
.prompter b { font-family: var(--serif); font-weight: 300; font-size: 24px; line-height: 1.15; letter-spacing: -.02em; }
.gnext { position: absolute; right: 12px; top: 50%; width: 38px; height: 38px; margin-top: -19px; border-radius: 50%; background: var(--blue); color: var(--ink); font-size: 16px; }
.viewfinder .recdot { top: auto; bottom: 30px; left: 18px; }
.viewfinder.guided { aspect-ratio: 3 / 2; }
.viewfinder.guided .prompter { top: 0; left: 0; right: 0; min-height: 92px; align-content: center; border-radius: 0; background: var(--ink); -webkit-backdrop-filter: none; backdrop-filter: none; }
.viewfinder.guided .feed { top: 92px; height: calc(100% - 92px); transform: scale(1.35); transform-origin: 52% 6%; }
.viewfinder .recbtn { z-index: 1; }

/* care view: preferences label, warning on a rising score */
.prof small { align-self: center; margin-right: 4px; font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .02em; color: var(--sub); }
.panel.warnp, .panel.critp { position: relative; overflow: hidden; }
.panel.warnp::before, .panel.critp::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--warn); }
.panel.critp::before { background: var(--crit); }
.big.up, .big.up small { color: var(--warn); }
.big.up.crit, .big.up.crit small { color: var(--crit); }
.vcard.fin .poster { aspect-ratio: 4 / 5; box-shadow: 0 0 0 1px rgba(250,245,242,.12); }
.vcard.fin .sil { width: 70%; }
.fl, .vcard.fin { animation: rise .9s cubic-bezier(.16,1,.3,1) both; }
.vcard.fin { animation-delay: .35s; }
@keyframes rise { from { opacity: 0; transform: translateY(16px); } }
@media (prefers-reduced-motion: reduce) { .fl, .vcard.fin { animation: none; } }
/* brand: musubi logo + wordmark */
.knot { width: 31px; height: 27px; flex: none; display: block; }
.controls h1, .topbar .logo { font-family: "Fraunces", var(--serif); font-weight: 560; font-variation-settings: "SOFT" 100, "WONK" 0, "opsz" 96; letter-spacing: -.02em; gap: 9px; }
.controls h1 { font-size: 20px; }
.topbar .logo { font-size: 19px; }
/* "What keeps you going": a pale blush cord sweeping across a soft pink block */
.arch { background: #FFA9C3; color: var(--ink); }
.arch::after { display: none; }
.arch .cord { position: absolute; right: -30px; top: -78px; width: 480px; height: auto; pointer-events: none; }
.arch small, .arch h2, .arch p { position: relative; z-index: 1; }
.arch small { color: var(--ink); opacity: .75; }
.finale .why { position: relative; overflow: hidden; background: #FFA9C3; color: var(--ink); border-top: 0; border-radius: 20px; padding: 22px 26px 26px; }
.finale .why .cord { position: absolute; right: -40px; top: -64px; width: 340px; height: auto; pointer-events: none; }

/* Set-up runs on the iPad turned towards her, so every screen speaks to her directly. */
const QS = [
  { k: "reasons", t: "What keeps you going?", h: "Pick up to two.", map: REASONS, max: 2 },
  { k: "tone", t: "How should our messages sound?", h: "Pick one.", map: TONE, one: true },
  { k: "cap", t: "What would help you most?", h: "Pick any.", map: CAP },
  { k: "opp", t: "What could get in the way?", h: "Pick any, or none.", map: OPP }
];
/* Guided questions on the camera screen: things worth saying that may not come to her on the spot. */
const GUIDE = {
  benefit: ["Who are you doing this for? Say their names.", "What's one moment in the next few years you don't want to miss?", "What will you do on the day you take your last pill?", "What would you tell yourself on a day you want to stop?"],
  risk: ["What was the hardest part of treatment for you?", "What do you never want to feel or go through again?", "What did cancer take from you that you want to keep now?", "What would you tell yourself on a day you want to stop?"]
};
function nextGuide() {
  const g = GUIDE[S.rec.prompt || "benefit"];
  S.rec.gq = ((S.rec.gq || 0) + 1) % g.length;
  const q = document.querySelector(".gq"), n = document.querySelector(".gn");
  if (q) { q.textContent = g[S.rec.gq]; n.textContent = S.rec.gq + 1; }
}
/* She adds the numbers of people she'd like to invite; PinkyPromise texts them a link to record a message for her future self. */
const CONTACTS = [["Tom", "+41 79 482 17 30"], ["Mum", "+41 76 215 88 04"], ["Sara", "+41 78 903 41 62"]];
function inviteCard() {
  const v = S.inv;
  if (v.sent) return `<div class="invite sent"><div class="faces">${v.list.map(i => `<span>${CONTACTS[i][0][0]}</span>`).join("")}</div>
    <div><b>Invites sent to ${v.list.length} ${v.list.length === 1 ? "person" : "people"}</b><small>PinkyPromise texted them a link to record a message for future you.</small></div></div>`;
  const next = CONTACTS.findIndex((_, i) => !v.list.includes(i));
  return `<div class="invite col">
    ${v.list.map(i => `<div class="contact"><span class="cav">${CONTACTS[i][0][0]}</span><b>${CONTACTS[i][0]}</b><span>${CONTACTS[i][1]}</span><button data-act="uninvite" data-v="${i}" aria-label="Remove ${CONTACTS[i][0]}">✕</button></div>`).join("")}
    <div class="addrow"><span class="field">+41 Phone number</span><button class="btn ghost" data-act="addcontact" ${next < 0 ? "disabled" : ""}>+ Add</button></div></div>`;
}
function consultation() {

  }).join("")}</ol>`;

    b = `<h3 class="qbig">Before we start, is this OK with you?</h3>
      <div class="toggles">${t("clinic", "We can see your prescriptions and appointments")}${t("checkins", "Short check-ins on your phone")}${t("nurse", "A nurse may call you")}</div>
      <div class="privacy"><span class="lock">${ic.lock}</span><div><b>Your information stays private.</b>
        <p>Only your care team sees what you share here. It is never sold or shared with your employer, insurer or anyone else. If you report a side effect, it goes to drug safety without your name, as the law requires. Protected under Swiss and EU data protection law, to the same standards Roche applies to patient data. You can switch any part off at any time.</p></div></div>
      <div class="btnrow"><button class="btn" data-act="agree">I agree →</button></div>`;
  } else if (r.phase === "needs") {
    const q = QS[r.q], sel = k => q.one ? n[q.k] === k : n[q.k].includes(k);
    b = `<div class="qcount">${QS.map((_, i) => `<i class="${i <= r.q ? "on" : ""}"></i>`).join("")}<span>${r.q + 1} of ${QS.length}</span></div>
      <div><h3 class="qbig">${q.t}</h3><p class="qhint">${q.h}</p></div>
      <div class="bigopts">${Object.entries(q.map).map(([k, l]) => `<button class="bo ${q.one ? "radio" : ""} ${sel(k) ? "on" : ""}" ${q.one ? `data-act="need" data-k="${q.k}"` : `data-act="multi" data-k="${q.k}" data-max="${q.max || 9}"`} data-v="${k}" aria-pressed="${sel(k)}"><span class="ck">${sel(k) ? "✓" : ""}</span>${typeof l === "string" ? l : l.l}</button>`).join("")}</div>
      <div class="btnrow"><button class="btn" data-act="qnext" ${r.q === 0 && !n.reasons.length ? "disabled" : ""}>${r.q < QS.length - 1 ? "Next →" : "Show me →"}</button></div>`;
  } else if (r.phase === "confirm") {
    const a = arch();
    b = `<div class="arch">${knot("#FFE4EC", "#FFA9C3", "cord")}<small>What keeps you going</small><h2>${a.l}</h2></div>
      <div class="preview"><small>What you'll get on a hard day</small><div class="bub">${esc(previewLine())}</div></div>
      <div class="btnrow"><button class="btn" data-act="confirm">That's me →</button><button class="btn ghost" data-act="fix">Change answers</button></div>`;
  } else if (r.phase === "prompt") {
    b = `<h3 class="qbig">On a hard day, what should your message remind you of?</h3>
      <div class="choices">${Object.entries(PROMPTS).map(([k, p]) =>
        `<button class="choice" data-act="prompt" data-v="${k}"><span class="k">${p.k}</span><span class="q">${p.h}</span><span class="d">${p.d}</span></button>`).join("")}</div>`;
  } else if (r.phase === "record" || r.phase === "recording") {
    const on = r.phase === "recording", g = GUIDE[r.prompt || "benefit"], gi = (r.gq || 0) % g.length;
    b = `<h3 class="qbig">Record a message to your future self.</h3>
      <div class="viewfinder guided ${on ? "on" : ""}">
        <div class="prompter">${on ? `<small>Try talking about · <span class="gn">${gi + 1}</span> of ${g.length}</small><b class="gq">${g[gi]}</b><button class="gnext" data-act="gnext" aria-label="Next question">→</button>`
          : `<small>Your guide</small><b>Press record. A few questions will appear here to help you.</b>`}</div>
        <video class="feed" src="${VIDEO}" ${on ? "autoplay loop" : ""} muted playsinline preload="auto" aria-hidden="true"></video>
        ${on ? `<span class="recdot">● REC <b class="timer">${fmt(r.seconds)}</b></span>` : ""}
        <button class="recbtn ${on ? "stop" : ""}" data-act="${on ? "stop" : "start"}" aria-label="${on ? "Stop" : "Record"}"></button></div>`;
  } else if (r.phase === "recorded" || r.phase === "listening") {
    const playing = r.phase === "listening";
    b = `<h3 class="qbig">Watch it before you save.</h3>${msgCard(`${fmtName()} · ${msgLen()}`, playing)}
      <div class="btnrow"><button class="btn ghost" data-act="listen" ${playing ? "disabled" : ""}>${playing ? "Playing…" : "▶ Watch"}</button>
        <button class="btn" data-act="save">Save</button><button class="btn ghost" data-act="again">Redo</button></div>`;
  } else if (r.phase === "invite") {
    const k = S.inv.list.length;
    b = `<div><h3 class="qbig">Invite someone to leave a message for future you.</h3><p class="qhint">Add their number. We'll text them a link to record a short video you can watch on harder days.</p></div>
      ${inviteCard()}
      <div class="btnrow">${S.inv.sent ? `<button class="btn" data-act="finish">Finish →</button>`
        : k ? `<button class="btn" data-act="sendinv">Send ${k} invite${k > 1 ? "s" : ""} →</button><button class="btn ghost" data-act="finish">Skip</button>`
        : `<button class="btn ghost" data-act="finish">Skip for now</button>`}</div>`;
  } else {
    /* Closing moment: the stepper steps aside for the thank-you, the reason she named in set-up, and her video. */
    return `<div class="finale"><div class="fl"><small>Saved · it's on your phone now</small><h2>Thank you, Lara.</h2>
      <div class="why">${knot("#FFE4EC", "#FFA9C3", "cord")}<span>What keeps you going</span><b>${arch().l}</b></div>
      <button class="btn" data-act="go" data-v="1">Done</button></div>
      ${msgCard(`${fmtName()} · ${msgLen()}`, false, "fin")}</div>`;
  }
  return `<div class="stepper">${rail}<div class="panel stbody">${head}<div class="qwrap">${b}</div></div></div>`;
}


function chart(upto) {
  const W = 620, H = 210, L = 30, R = 8, T = 12, B = 28;
  const x = m => L + (m / 12) * (W - L - R);
  const y = v => T + (1 - v / 100) * (H - T - B);
  const pts = DATA.slice(0, upto + 1).map((v, m) => [x(m), y(v)]);
  const last = DATA[upto];
  const col = last >= 60 ? "var(--crit)" : last >= 30 ? "var(--warn)" : "var(--ink)";
  let g = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Risk score by month"><defs><linearGradient id="ar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF8FB1" stop-opacity=".22"/><stop offset="1" stop-color="#FF8FB1" stop-opacity="0"/></linearGradient></defs>`;
  [0, 50, 100].forEach(v => {
    g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/>`;
    g += `<text x="${L - 7}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--sub)">${v}</text>`;
  });
  [[30, "var(--warn)", "Message plays"], [60, "var(--crit)", "Nurse calls"]].forEach(([v, c, t]) => {
    g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="${c}" stroke-width="1.2" stroke-dasharray="4 4"/>`;
    g += `<rect x="${W - R - 98}" y="${y(v) - 20}" width="98" height="17" rx="8.5" fill="var(--card)"/>`;
    g += `<text x="${W - R - 49}" y="${y(v) - 8}" text-anchor="middle" font-size="10.5" font-weight="600" fill="${c}">${t}</text>`;
  });
  [0, 3, 6, 9, 12].forEach(m => g += `<text x="${x(m)}" y="${H - 7}" text-anchor="middle" font-size="11" fill="var(--sub)">${MONTHS[m]}</text>`);
  if (upto > 0) {
    const line = pts.map(p => p.map(n => n.toFixed(1)).join(",")).join(" ");
    g += `<polygon points="${line} ${x(upto).toFixed(1)},${y(0)} ${x(0)},${y(0)}" fill="url(#ar)"/>`;
    g += `<polyline points="${line}" fill="none" stroke="var(--blue)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  }
  g += `<circle cx="${x(upto)}" cy="${y(last)}" r="6.5" fill="${col}" stroke="#fff" stroke-width="2.5"/></svg>`;
  return `<div class="panel chart"><h4>Risk score</h4>${g}</div>`;
}

const CAPS = {
  welcome: "In the consultation room, the tablet faces Lara.",
  setup: "Four questions, her archetype, then a video to her future self.",
  saved: "She leaves with her own words, already on her phone.",
  year: "One year on: play last year's message together. Keep it or record anew.",
  care: ["", "Her check-in reaches the care team. All steady.", "Drifting a little: her own message plays on her phone.", "Drastic change: a nurse calls first. Her message waits.", ""]
};
const PHONE_TONE = { warm: "gentle", facts: "facts", numbers: "facts" };
function syncPhone() {
  const w = document.getElementById("phone").contentWindow;
  if (w && w.phoneGo) { w.phoneVideo = VIDEO_BLOB; w.phoneGo(S.scene, PHONE_TONE[S.needs.tone]); }

function render() {
  document.getElementById("moments").innerHTML = PHASES.map((p, pi) => `<div class="ph ${SCENES[S.scene].ph === pi ? "on" : ""}"><b>${pi + 1} · ${p}</b>${SCENES.map((sc, i) => sc.ph === pi ? `<button class="mo ${i === S.scene ? "on" : ""}" data-act="go" data-v="${i}">${sc.tab}</button>` : "").join("")}</div>`).join("");
  const care = SCENES[S.scene].ph === 1;
  document.getElementById("caption").textContent = care ? CAPS.care[S.scene] : S.view === "setup" && S.rec.phase === "done" ? CAPS.saved : CAPS[S.view];
  document.getElementById("lab-tab").textContent = care ? "Care team's view · between visits" : "Clinic tablet · facing Lara";
  const body = care ? ptrow() + [null, checkin, dip, drop][S.scene]() : { welcome, setup: consultation, year: yearly }[S.view]();
  const clock = ["10:31&nbsp;&nbsp;Mon 3 Mar", "18:09&nbsp;&nbsp;Thu 3 Apr", "09:45&nbsp;&nbsp;Sat 12 Jul", "09:02&nbsp;&nbsp;Fri 3 Oct", "14:40&nbsp;&nbsp;Tue 3 Mar"][S.scene];
  document.getElementById("screen").innerHTML = `
    <div class="status"><span>${clock}</span><span class="r">${ic.wifi}<span>100%</span>${ic.batt}</span></div>
    <div class="main">
      <div class="topbar"><div class="logo">${knot("#F2577E", "#FCF5F5")}pinkypromise</div><span class="where">${care ? "Care team · Lea, breast nurse" : "Breast centre · Room 3"}</span></div>
      <div class="content">${body}</div>
    </div>`;
  /* The phone only joins from Month 1, once she is home between visits. */
  const showPhone = S.scene > 0;
  document.getElementById("device").classList.toggle("solo", !showPhone);
  syncPhone();
  fit();
}

/* The stage keeps one fixed layout (tablet + phone). Solo mode just hides the phone and recentres the tablet,
   so switching is a single transform transition: the tablet glides and rescales, the phone slides in after it. */
function fit() {
  const dev = document.getElementById("device"), f = document.getElementById("fit");
  const solo = dev.classList.contains("solo"), H = 940;
  const top = f.getBoundingClientRect().top + window.scrollY;
  const avH = Math.max(300, window.innerHeight - top - 24);
  const avW = document.querySelector(".wrap").clientWidth - 32;
  const w = solo ? 1250 : 1730;
  const sc = Math.min(1, avH / H, avW / w);
  f.style.width = avW + "px"; f.style.height = H * sc + "px";
  dev.style.transform = `translate(${(avW - w * sc) / 2}px, 0) scale(${sc})`;
}
function stopTimer() { if (timer) { clearInterval(timer); timer = null; } }
function later(ms, fn) { setTimeout(() => { fn(); render(); }, matchMedia("(prefers-reduced-motion: reduce)").matches ? 50 : ms); }
function reset() {
  S.scene = 0; S.view = "welcome";
  Object.assign(S.rec, { phase: "consent", q: 0, prompt: null, format: "video", text: DEFAULT_MSG, seconds: 0 });
  Object.assign(S.needs, { reasons: ["family"], tone: "warm", cap: ["effects"], opp: ["refills"], set: false });
  Object.assign(S.consent, { clinic: true, checkins: true, nurse: true });
  Object.assign(S.drop, { phase: "new", route: "onc", offer: false });
  S.inv = { list: [], sent: false };
  S.year.phase = "start";
}

document.addEventListener("input", e => { if (e.target.id === "msgtext") S.rec.text = e.target.value; });
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const v = el.dataset.v, r = S.rec;
  switch (el.dataset.act) {
    case "go":
      stopTimer(); S.scene = +v;
      S.view = S.scene === 4 ? "year" : r.phase === "consent" ? "welcome" : "setup";
      break;
    case "begin": S.view = "setup"; break;
    case "addcontact": { const i = CONTACTS.findIndex((_, k) => !S.inv.list.includes(k)); if (i >= 0) S.inv.list.push(i); break; }
    case "uninvite": S.inv.list = S.inv.list.filter(i => i !== +v); break;
    case "sendinv": S.inv.sent = true; break;
    case "restart": reset(); break;
    case "agree": r.phase = "needs"; r.q = 0; break;
    case "qnext": if (r.q < QS.length - 1) r.q++; else r.phase = "confirm"; break;
    case "need": S.needs[el.dataset.k] = v; break;
    case "multi": {
      const k = el.dataset.k, cur = S.needs[k];
      if (cur.includes(v)) S.needs[k] = cur.filter(x => x !== v);
      else S.needs[k] = [...cur, v].slice(-(+el.dataset.max));
      break;
    }
    case "fix": r.phase = "needs"; r.q = 0; break;
    case "confirm": S.needs.set = true; r.phase = "prompt"; break;
    case "prompt": r.prompt = v; r.format = "video"; r.phase = "record"; r.gq = 0; break;
    case "start": r.phase = "recording"; r.seconds = 0; timer = setInterval(() => { r.seconds++; const t = document.querySelector(".timer"); if (t) t.textContent = fmt(r.seconds); if (r.seconds % 6 === 0) nextGuide(); }, 1000); break;
    case "gnext": nextGuide(); return;
    case "stop": stopTimer(); r.phase = "recorded"; break;
    case "listen": r.phase = "listening"; later(4000, () => { if (r.phase === "listening") r.phase = "recorded"; }); break;
    case "back":
      stopTimer();
      if (r.phase === "needs" && r.q > 0) r.q--;
      else if (r.phase === "confirm") { r.phase = "needs"; r.q = QS.length - 1; }
      else r.phase = v;
      break;
    case "again": r.phase = "record"; r.seconds = 0; break;
    case "save": r.phase = "invite"; break;
    case "finish": r.phase = "done"; break;
    case "tog": S.consent[v] = !S.consent[v]; break;
    case "call": S.drop.phase = "calling"; break;
    case "tag": S.drop.tags = S.drop.tags.includes(v) ? S.drop.tags.filter(x => x !== v) : [...S.drop.tags, v]; break;
    case "route": S.drop.route = v; break;
    case "offer": S.drop.offer = !S.drop.offer; break;
    case "handover": S.drop.phase = "done"; break;
    case "yplay": S.year.phase = "playing"; later(4000, () => { if (S.year.phase === "playing") S.year.phase = "choose"; }); break;
    case "ykeep": S.year.phase = "kept"; break;
    case "ynew": S.year.phase = "new"; break;
    case "ysave": S.rec.text = "Noah starts secondary school in September. Still here, still going."; S.year.phase = "saved"; break;
    default: return;
  }
  render();
});
